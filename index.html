<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الأواني العصرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
            --border-color: #e2e8f0;
            
            /* ألوان لوحة التحكم الداكنة */
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --text-dark: #f8fafc;
            --subtext-dark: #a1a1aa;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 50px; }

        /* HEADER */
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.3rem; font-weight: 800; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: #f1f5f9; color: #0f172a; border: none; padding: 10px 16px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 8px; position: relative; transition: 0.2s; }
        .icon-btn:hover { background: #e2e8f0; }
        .cart-badge { background: var(--accent-blue); color: white; font-size: 0.75rem; border-radius: 50%; padding: 2px 7px; font-weight: bold; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* STORE SECTIONS */
        .section-header { margin: 35px 0 20px 0; display: flex; align-items: center; justify-content: space-between; }
        .section-title { font-size: 1.3rem; font-weight: 800; color: var(--text-main); }
        .section-title span { color: var(--accent-blue); }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
        
        /* CARD DESIGN */
        .product-card { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -10px rgba(0,0,0,0.08); }
        .product-img { width: 100%; height: 210px; object-fit: cover; background: #f1f5f9; }
        .product-info { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
        .product-price { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin-bottom: 14px; }
        .add-cart-btn { width: 100%; background: var(--accent-blue); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .add-cart-btn:hover { background: #1d4ed8; }

        /* CART MODAL (DRAWER) */
        .cart-modal { display: none; position: fixed; top: 0; right: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 300; justify-content: flex-end; }
        .cart-content { background: white; width: 100%; max-width: 420px; height: 100%; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: -4px 0 15px rgba(0,0,0,0.1); }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .cart-items { flex-grow: 1; overflow-y: auto; margin: 20px 0; }
        .cart-item { display: flex; gap: 12px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .cart-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-weight: bold; font-size: 0.9rem; }
        .cart-item-price { color: var(--text-muted); font-size: 0.85rem; }
        .checkout-btn { width: 100%; background: var(--success); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 1rem; }

        /* PAYMENT MODAL */
        .payment-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 400; justify-content: center; align-items: center; padding: 15px; }
        .payment-content { background: white; padding: 25px; border-radius: 16px; width: 100%; max-width: 450px; }
        .payment-option { border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .payment-option input { cursor: pointer; }

        /* SETTINGS PAGE (DARK MODE) */
        #settingsPage { display: none; background-color: var(--bg-dark); color: var(--text-dark); position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; z-index: 200; padding: 25px 20px; }
        .settings-container { max-width: 600px; margin: 0 auto; }
        .settings-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; border-bottom: 1px solid #27272a; padding-bottom: 15px; }
        .close-settings-btn { background: #27272a; border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; }
        .group-label { font-size: 0.85rem; color: var(--subtext-dark); font-weight: 600; margin: 25px 0 10px 0; text-transform: uppercase; }
        .settings-card { background: var(--card-dark); border-radius: 16px; padding: 20px; border: 1px solid #27272a; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--subtext-dark); margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #18181b; border: 1px solid #3f3f46; color: white; border-radius: 10px; font-size: 0.95rem; outline: none; }
        .save-btn { width: 100%; background: var(--success); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .admin-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #18181b; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #27272a; }
        .admin-item img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .admin-item-info { flex: 1; }
        .action-btns { display: flex; gap: 8px; }
        .edit-btn-icon { background: var(--accent-blue); color: white; border: none; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; }
        .del-btn-icon { background: var(--danger); color: white; border: none; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية -->
    <div id="storePage">
        <header>
            <h1>متجر الأواني العصرية</h1>
            <div class="header-actions">
                <button class="icon-btn" onclick="openCart()">
                    <i class="fa-solid fa-cart-shopping"></i> السلة
                    <span class="cart-badge" id="cartCount">0</span>
                </button>
                <button class="icon-btn" style="background:#0f172a; color:white;" onclick="toggleView('settings')">
                    <i class="fa-solid fa-sliders"></i> الإعدادات
                </button>
            </div>
        </header>

        <div class="container">
            <div class="section-header"><div class="section-title"><span>#</span> الأكثر مبيعاً</div></div>
            <div class="products-grid" id="bestSellersGrid"></div>

            <div class="section-header"><div class="section-title"><span>#</span> الفناجيل، الدلات والكاسات</div></div>
            <div class="products-grid" id="cupsGrid"></div>

            <div class="section-header"><div class="section-title"><span>#</span> القدور والصحون</div></div>
            <div class="products-grid" id="platesGrid"></div>
        </div>
    </div>

    <!-- نافذة السلة الجانبية -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div>
                <div class="cart-header">
                    <h3>سلة الشراء</h3>
                    <button class="close-settings-btn" style="color:black; background:#f1f5f9;" onclick="closeCart()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="cart-items" id="cartItemsContainer"></div>
            </div>
            <div>
                <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:15px; font-size:1.1rem;">
                    <span>المجموع الإجمالي:</span>
                    <span id="cartTotal">0 درهم</span>
                </div>
                <button class="checkout-btn" onclick="openPayment()">المتابعة لإتمام الدفع</button>
            </div>
        </div>
    </div>

    <!-- نافذة طرق الدفع -->
    <div class="payment-modal" id="paymentModal">
        <div class="payment-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>اختر طريقة الدفع</h3>
                <button class="close-settings-btn" style="color:black; background:#f1f5f9;" onclick="closePayment()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="payment-option">
                <input type="radio" name="pay" id="pay1" checked>
                <label for="pay1"><i class="fa-solid fa-credit-card"></i> البطاقة الائتمانية (فيزا / ماستركارد)</label>
            </div>
            <div class="payment-option">
                <input type="radio" name="pay" id="pay2">
                <label for="pay2"><i class="fa-brands fa-apple"></i> Apple Pay</label>
            </div>
            <div class="payment-option">
                <input type="radio" name="pay" id="pay3">
                <label for="pay3"><i class="fa-solid fa-hand-holding-dollar"></i> الدفع عند الاستلام</label>
            </div>
            <button class="checkout-btn" style="margin-top:15px; background:var(--accent-blue);" onclick="confirmPayment()">تأكيد الطلب والدفع</button>
        </div>
    </div>

    <!-- صفحة الإعدادات والتحكم (الوضع الداكن) -->
    <div id="settingsPage">
        <div class="settings-container">
            <div class="settings-header">
                <h2>الإعدادات والتحكم</h2>
                <button class="close-settings-btn" onclick="toggleView('store')"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="group-label">إدارة المنتجات</div>
            <div class="settings-card">
                <h3 style="font-size: 1.1rem; margin-bottom: 16px;" id="formTitle">إضافة منتج جديد</h3>
                <form id="productForm" onsubmit="saveProduct(event)">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label>اسم المنتج</label>
                        <input type="text" id="pName" placeholder="مثال: طقم صحون سيراميك" required>
                    </div>
                    <div class="form-group">
                        <label>القسم</label>
                        <select id="pCategory">
                            <option value="best">الأكثر مبيعاً</option>
                            <option value="cups">الفناجيل، الدلات والكاسات</option>
                            <option value="plates">القدور والصحون</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>السعر (الرقم فقط)</label>
                        <input type="number" id="pPrice" placeholder="مثال: 180" required>
                    </div>
                    <div class="form-group">
                        <label>رابط الصورة</label>
                        <input type="url" id="pImg" placeholder="https://..." required>
                    </div>
                    <button type="submit" class="save-btn" id="saveBtn"><i class="fa-solid fa-plus"></i> حفظ المنتج</button>
                </form>
            </div>

            <div class="group-label">المنتجات الحالية (تعديل / حذف)</div>
            <div class="settings-card" id="adminList"></div>
        </div>
    </div>

    <script>
        const initialData = [
            { id: 1, name: "طقم دلال ذهبي فاخر", category: "best", price: 320, img: "https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?w=500" },
            { id: 2, name: "فناجيل قهوة شفافة 12 قطعة", category: "cups", price: 85, img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=500" },
            { id: 3, name: "طقم قدور جرانيت 5 قطع", category: "plates", price: 450, img: "https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=500" }
        ];

        let cart = [];

        function getProducts() {
            const data = localStorage.getItem('my_modern_store_v3');
            return data ? JSON.parse(data) : initialData;
        }

        function renderStore() {
            const products = getProducts();
            const bestGrid = document.getElementById('bestSellersGrid');
            const cupsGrid = document.getElementById('cupsGrid');
            const platesGrid = document.getElementById('platesGrid');

            bestGrid.innerHTML = ''; cupsGrid.innerHTML = ''; platesGrid.innerHTML = '';

            products.forEach(p => {
                const html = `
                    <div class="product-card">
                        <img src="${p.img}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x200'">
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price} درهم</div>
                            <button class="add-cart-btn" onclick="addToCart(${p.id})">
                                <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
                            </button>
                        </div>
                    </div>
                `;
                if(p.category === 'best') bestGrid.innerHTML += html;
                else if(p.category === 'cups') cupsGrid.innerHTML += html;
                else if(p.category === 'plates') platesGrid.innerHTML += html;
            });
        }

        /* إدارة السلة والدفع */
        function addToCart(id) {
            const product = getProducts().find(p => p.id === id);
            if(product) {
                cart.push(product);
                updateCart();
                openCart();
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.length;
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';
            let total = 0;

            if(cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:20px;">السلة فارغة حالياً</p>';
            } else {
                cart.forEach((item, index) => {
                    total += Number(item.price);
                    container.innerHTML += `
                        <div class="cart-item">
                            <img src="${item.img}">
                            <div class="cart-item-info">
                                <div class="cart-item-title">${item.name}</div>
                                <div class="cart-item-price">${item.price} درهم</div>
                            </div>
                            <button onclick="removeFromCart(${index})" style="background:none; border:none; color:var(--danger); cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                });
            }
            document.getElementById('cartTotal').innerText = total + ' درهم';
        }

        function openCart() { document.getElementById('cartModal').style.display = 'flex'; }
        function closeCart() { document.getElementById('cartModal').style.display = 'none'; }
        
        function openPayment() {
            if(cart.length === 0) return alert('السلة فارغة!');
            closeCart();
            document.getElementById('paymentModal').style.display = 'flex';
        }
        function closePayment() { document.getElementById('paymentModal').style.display = 'none'; }
        function confirmPayment() {
            alert('تم استلام طلبك بنجاح! شكراً لتسوقك معنا.');
            cart = [];
            updateCart();
            closePayment();
        }

        /* لوحة التحكم */
        function renderAdminList() {
            const products = getProducts();
            const list = document.getElementById('adminList');
            list.innerHTML = '';

            products.forEach(p => {
                list.innerHTML += `
                    <div class="admin-item">
                        <img src="${p.img}" onerror="this.src='https://via.placeholder.com/50'">
                        <div class="admin-item-info">
                            <div class="admin-item-title">${p.name}</div>
                            <div class="admin-item-price">${p.price} درهم</div>
                        </div>
                        <div class="action-btns">
                            <button class="edit-btn-icon" onclick="editProduct(${p.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="del-btn-icon" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleView(view) {
            if(view === 'settings') {
                document.getElementById('settingsPage').style.display = 'block';
                renderAdminList();
            } else {
                document.getElementById('settingsPage').style.display = 'none';
                renderStore();
            }
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const name = document.getElementById('pName').value;
            const category = document.getElementById('pCategory').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImg').value;

            let products = getProducts();

            if(id) {
                products = products.map(p => p.id == id ? { id: Number(id), name, category, price: Number(price), img } : p);
            } else {
                products.push({ id: Date.now(), name, category, price: Number(price), img });
            }

            localStorage.setItem('my_modern_store_v3', JSON.stringify(products));
            resetForm();
            renderAdminList();
            renderStore();
        }

        function editProduct(id) {
            const p = getProducts().find(item => item.id == id);
            if(!p) return;
            document.getElementById('editId').value = p.id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pCategory').value = p.category;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pImg').value = p.img;

            document.getElementById('formTitle').innerText = 'تعديل بيانات المنتج';
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-check"></i> تحديث المنتج';
        }

        function deleteProduct(id) {
            if(confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                let products = getProducts().filter(p => p.id != id);
                localStorage.setItem('my_modern_store_v3', JSON.stringify(products));
                renderAdminList();
                renderStore();
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('formTitle').innerText = 'إضافة منتج جديد';
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-plus"></i> حفظ المنتج';
        }

        renderStore();
    </script>
</body>
</html>
