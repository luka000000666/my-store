<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الأواني والضيافة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0f0f11;
            --card-bg: #18181b;
            --primary-gold: #eab308;
            --accent-red: #dc2626;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
            --modal-bg: #121215;
            --whatsapp: #25d366;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 60px; }

        /* شريط العروض العلوي */
        .promo-banner { background: var(--accent-red); color: white; text-align: center; padding: 8px; font-size: 0.85rem; font-weight: bold; display: none; }
        
        /* الهيدر العلوي المطابق للصور */
        header { background: #141417; border-bottom: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-right, .header-left { display: flex; align-items: center; gap: 15px; }
        
        .header-icon-btn { background: transparent; border: none; color: var(--text-main); font-size: 1.2rem; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; }
        .header-icon-btn:hover { color: var(--primary-gold); }
        .cart-badge { position: absolute; top: -6px; right: -8px; background: var(--accent-red); color: white; font-size: 0.65rem; border-radius: 50%; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .store-logo { font-size: 1.3rem; color: var(--text-main); font-weight: 900; letter-spacing: 1px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .store-logo span { color: var(--accent-red); }

        /* شريط البحث */
        .search-container { max-width: 1000px; margin: 15px auto 0 auto; padding: 0 15px; display: none; }
        .search-container.active { display: block; }
        .search-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 10px; outline: none; background: #1c1c21; color: white; font-size: 0.9rem; }

        /* الأقسام والمنتجات */
        .container { max-width: 1000px; margin: 10px auto; padding: 0 15px; }
        .section-title { font-size: 1.1rem; font-weight: 800; margin: 25px 0 15px 0; color: var(--text-main); border-right: 4px solid var(--accent-red); padding-right: 10px; }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media(min-width: 768px) { .products-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .product-img { width: 100%; height: 150px; object-fit: cover; background: #27272a; }
        .product-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
        .stock-badge { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
        .rating { color: var(--primary-gold); font-size: 0.75rem; margin-bottom: 6px; cursor: pointer; }
        .product-price { font-size: 0.95rem; font-weight: 800; color: var(--primary-gold); margin-bottom: 8px; }
        .add-cart-btn { width: 100%; background: #27272a; color: var(--text-main); border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
        .add-cart-btn:hover { background: var(--accent-red); color: white; }
        .add-cart-btn:disabled { background: #18181b; color: #52525b; cursor: not-allowed; border-color: #27272a; }

        /* النوافذ المنبثقة Modals */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:300; justify-content:center; align-items:flex-end; }
        @media(min-width: 768px) { .modal { align-items: center; } }

        .modal-content { background: var(--modal-bg); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border-color); }
        @media(min-width: 768px) { .modal-content { border-radius: 20px; } }

        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }

        /* قائمة الحساب */
        .user-menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-bottom: 1px solid #1c1c21; color: var(--text-main); text-decoration: none; font-size: 0.9rem; cursor: pointer; }
        .user-menu-item:hover { background: #1c1c21; border-radius: 8px; }
        .user-menu-item i { width: 20px; color: var(--text-muted); font-size: 1rem; }

        /* نموذج تسجيل الدخول */
        .auth-box { text-align: center; }
        .auth-avatar { width: 60px; height: 60px; border-radius: 50%; background: #27272a; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; font-size: 1.8rem; color: var(--text-muted); border: 1px solid var(--border-color); }
        .social-btn-group { display: flex; justify-content: center; gap: 12px; margin-top: 15px; }
        .social-btn { width: 42px; height: 42px; border-radius: 50%; background: #1c1c21; border: 1px solid var(--border-color); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }

        .form-group { margin-bottom: 12px; text-align: right; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 6px; font-weight: 600; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; background: #1c1c21; color: white; }

        .card-box { background: #18181b; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .status-tag { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; background: #0284c7; color: white; }
        
        .admin-section { background: #18181b; color: white; padding: 15px; border-radius: 12px; margin-top: 15px; border: 1px solid var(--border-color); }
        .admin-section input, .admin-section select { background: #27272a; color: white; border: 1px solid #3f3f46; }
        .coupon-item { background: #27272a; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }

        /* شريط الشحن المجاني التفاعلي */
        .shipping-progress-bg { background: #27272a; border-radius: 10px; height: 10px; overflow: hidden; margin: 8px 0; }
        .shipping-progress-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.3s; }

        /* القائمة الجانبية للأقسام */
        .side-menu { display: none; position: fixed; top:0; right:0; width:80%; max-width:300px; height:100%; background: #121215; z-index:400; border-left: 1px solid var(--border-color); padding: 20px; }
        .side-menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .side-menu-item { padding: 12px 0; border-bottom: 1px solid #1c1c21; color: var(--text-main); font-size: 0.9rem; cursor: pointer; display: flex; justify-content: space-between; }

        @media print {
            body * { visibility: hidden; }
            #printableInvoice, #printableInvoice * { visibility: visible; }
            #printableInvoice { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; background: white; color: black; }
        }
    </style>
</head>
<body>

    <!-- شريط العروض -->
    <div class="promo-banner" id="promoBanner">
        <span id="bannerText">🔥 عروض لفترة محدودة! تنتهي خلال:</span> <span id="timer">00:00:00</span>
    </div>

    <!-- الهيدر العلوي -->
    <header>
        <div class="header-right">
            <button class="header-icon-btn" onclick="toggleSideMenu()"><i class="fa-solid fa-bars"></i></button>
        </div>

        <a href="#" class="store-logo">
            <i class="fa-solid fa-fire-flame-curved" style="color:var(--accent-red);"></i>
            متجري
        </a>

        <div class="header-left">
            <button class="header-icon-btn" onclick="toggleSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="header-icon-btn" onclick="openProfileModal()"><i class="fa-regular fa-user"></i></button>
            <button class="header-icon-btn" onclick="openCart()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- القائمة الجانبية للأقسام -->
    <div class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <h4>القائمة الرئيسية</h4>
            <button class="close-btn" onclick="toggleSideMenu()">✕</button>
        </div>
        <div class="side-menu-item" onclick="filterProducts('دلات'); toggleSideMenu();">الأواني والدلات <span><i class="fa-solid fa-chevron-left" style="font-size:0.7rem;"></i></span></div>
        <div class="side-menu-item" onclick="filterProducts('فناجيل'); toggleSideMenu();">الفناجيل والضيافة <span><i class="fa-solid fa-chevron-left" style="font-size:0.7rem;"></i></span></div>
        <div class="side-menu-item" onclick="filterProducts('قدور'); toggleSideMenu();">القدور والصحون <span><i class="fa-solid fa-chevron-left" style="font-size:0.7rem;"></i></span></div>
        <div class="side-menu-item" onclick="filterProducts(''); toggleSideMenu();">جميع المنتجات <span><i class="fa-solid fa-chevron-left" style="font-size:0.7rem;"></i></span></div>
    </div>

    <!-- حقل البحث -->
    <div class="search-container" id="searchContainer">
        <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن دلال، فناجيل، قدور..." onkeyup="filterProducts(this.value)">
    </div>

    <!-- شبكة المنتجات -->
    <div class="container">
        <div class="section-title">الأكثر مبيعاً</div>
        <div class="products-grid" id="bestGrid"></div>

        <div class="section-title">الفناجيل، الدلات والكاسات</div>
        <div class="products-grid" id="cupsGrid"></div>

        <div class="section-title">القدور والصحون</div>
        <div class="products-grid" id="platesGrid"></div>
    </div>

    <!-- نافذة السلة والدفع -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3>سلة المشتريات</h3>
                <button class="close-btn" onclick="closeModal('cartModal')">✕</button>
            </div>

            <div id="freeShippingContainer" style="background:#18181b; padding:10px; border-radius:8px; margin-bottom:12px; font-size:0.8rem; text-align:center; border:1px solid var(--border-color);">
                <div id="shippingText">أضف منتجات للحصول على شحن مجاني</div>
                <div class="shipping-progress-bg">
                    <div class="shipping-progress-fill" id="shippingProgress"></div>
                </div>
            </div>

            <div id="cartItems"></div>
            
            <div style="margin: 15px 0;">
                <label style="font-size:0.8rem; color:var(--text-muted); display:block; margin-bottom:6px;">هل لديك كود خصم؟</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="couponInput" placeholder="ادخل كود الخصم" style="flex:1; padding:10px; background:#1c1c21; border:1px solid var(--border-color); border-radius:6px; color:white; font-size:0.8rem;">
                    <button onclick="applyCoupon()" style="padding:10px 16px; background:var(--primary-gold); color:black; font-weight:bold; border:none; border-radius:6px; font-size:0.8rem; cursor:pointer;">تطبيق الخصم</button>
                </div>
            </div>

            <div class="form-group">
                <label>طريقة الدفع</label>
                <select id="paymentMethod">
                    <option value="الدفع عند الاستلام">الدفع عند الاستلام 💵</option>
                    <option value="تحويل بنكي">تحويل بنكي 🏦</option>
                </select>
            </div>

            <div style="margin-top:15px; font-weight:bold; display:flex; justify-content:space-between; background:#18181b; padding:12px; border-radius:8px;">
                <span>الإجمالي:</span><span id="cartTotal" style="color:var(--primary-gold);">0 درهم</span>
            </div>
            
            <button class="add-cart-btn" style="background:var(--primary-gold); color:black; margin-top:15px; padding:12px; font-size:0.9rem;" onclick="checkout()">إتمام الطلب</button>
            <button class="add-cart-btn" style="background:var(--whatsapp); color:white; margin-top:8px; padding:12px; font-size:0.9rem;" onclick="checkoutWhatsapp()"><i class="fa-brands fa-whatsapp"></i> اطلب عبر واتساب</button>
        </div>
    </div>

    <!-- نافذة الحساب وتسجيل الدخول -->
    <div class="modal" id="profileModal">
        <div class="modal-content" id="profileModalContent"></div>
    </div>

    <!-- نافذة التقييم -->
    <div class="modal" id="reviewModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3>تقييم المنتج والتعليقات</h3>
                <button class="close-btn" onclick="closeModal('reviewModal')">✕</button>
            </div>
            <div id="reviewList" style="max-height:150px; overflow-y:auto; margin-bottom:12px;"></div>
            <form onsubmit="addReview(event)">
                <input type="hidden" id="reviewProdId">
                <div class="form-group">
                    <label>التقييم بالنجوم</label>
                    <select id="reviewStars">
                        <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                        <option value="4">⭐⭐⭐⭐ (4/5)</option>
                        <option value="3">⭐⭐⭐ (3/5)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رأيك بالمنتج</label>
                    <input type="text" id="reviewComment" placeholder="اكتب رأيك هنا..." required>
                </div>
                <button type="submit" class="add-cart-btn" style="background:var(--primary-gold); color:black; font-weight:bold;">حفظ التقييم</button>
            </form>
        </div>
    </div>

    <!-- الفاتورة المخفية للطباعة -->
    <div id="printableInvoice" style="display:none;"></div>

    <script>
        let cart = [];
        let currentUser = JSON.parse(localStorage.getItem('current_user')) || null;
        let discountRate = 0;
        let timerInterval = null;

        const STORE_EMAIL = "Storesaifsaiff@gmail.com";
        const ADMIN_EMAIL = "syfb3144@gmail.com";
        const ADMIN_PASS = "Sayofii10pP";

        const initialProducts = [
            { id: 1, name: "طقم دلال ذهبي فاخر", category: "best", price: 320, stock: 5, img: "https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?w=500" },
            { id: 2, name: "فناجيل قهوة شفافة", category: "cups", price: 85, stock: 12, img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=500" }
        ];

        const initialCoupons = [{ code: "OFF10", percent: 10, active: true }];

        function getProducts() { return JSON.parse(localStorage.getItem('store_products')) || initialProducts; }
        function getUsers() { return JSON.parse(localStorage.getItem('store_users')) || []; }
        function getOrders() { return JSON.parse(localStorage.getItem('store_orders')) || []; }
        function getCoupons() { return JSON.parse(localStorage.getItem('store_coupons')) || initialCoupons; }
        function getReviews() { return JSON.parse(localStorage.getItem('store_reviews')) || {}; }
        function getFreeShippingMin() { return Number(localStorage.getItem('free_shipping_min')) || 300; }
        function generateOrderNumber() { return "ORD-" + Math.floor(10000 + Math.random() * 90000); }

        function getBannerConfig() {
            return JSON.parse(localStorage.getItem('store_banner_config')) || {
                show: true,
                text: "🔥 عروض لفترة محدودة! تنتهي خلال:",
                hours: 5
            };
        }

        function initBanner() {
            const config = getBannerConfig();
            const banner = document.getElementById('promoBanner');
            if (config.show) {
                banner.style.display = 'block';
                document.getElementById('bannerText').innerText = config.text;
                startTimer(config.hours * 3600);
            } else {
                banner.style.display = 'none';
                if(timerInterval) clearInterval(timerInterval);
            }
        }

        function startTimer(duration) {
            if(timerInterval) clearInterval(timerInterval);
            let timer = duration, hours, minutes, seconds;
            const display = document.querySelector('#timer');
            
            timerInterval = setInterval(function () {
                hours = parseInt(timer / 3600, 10);
                minutes = parseInt((timer % 3600) / 60, 10);
                seconds = parseInt(timer % 60, 10);

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = hours + ":" + minutes + ":" + seconds;

                if (--timer < 0) { timer = duration; }
            }, 1000);
        }

        function renderStore(filterQuery = "") {
            const products = getProducts();
            ['best', 'cups', 'plates'].forEach(cat => {
                const grid = document.getElementById(cat + 'Grid');
                if(!grid) return;
                grid.innerHTML = '';
                
                const filtered = products.filter(p => p.category === cat && p.name.includes(filterQuery));
                filtered.forEach(p => {
                    const isOutOfStock = p.stock <= 0;
                    grid.innerHTML += `
                        <div class="product-card">
                            <img src="${p.img}" class="product-img">
                            <div class="product-info">
                                <div>
                                    <div class="product-title">${p.name}</div>
                                    <div class="stock-badge">${isOutOfStock ? '<span style="color:var(--accent-red)">نفدت الكمية ❌</span>' : 'المتبقي: ' + p.stock + ' قطعة'}</div>
                                    <div class="rating" onclick="openReviewModal(${p.id})"><i class="fa-solid fa-star"></i> التقييمات والآراء</div>
                                </div>
                                <div>
                                    <div class="product-price">${p.price} درهم</div>
                                    <button class="add-cart-btn" ${isOutOfStock ? 'disabled' : ''} onclick="addToCart(${p.id})">
                                        ${isOutOfStock ? 'غير متوفر' : 'إضافة للسلة'}
                                    </button>
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        function toggleSideMenu() {
            const menu = document.getElementById('sideMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function toggleSearch() {
            const search = document.getElementById('searchContainer');
            search.classList.toggle('active');
        }

        function filterProducts(query) {
            renderStore(query);
        }

        function openReviewModal(prodId) {
            document.getElementById('reviewProdId').value = prodId;
            const reviews = getReviews()[prodId] || [];
            const container = document.getElementById('reviewList');
            container.innerHTML = reviews.length ? '' : '<small>لا توجد تقييمات بعد</small>';
            reviews.forEach(r => {
                container.innerHTML += `<div style="background:#1c1c21; padding:6px; border-radius:6px; margin-bottom:4px; font-size:0.8rem;"><b>${'⭐'.repeat(r.stars)}</b>: ${r.comment}</div>`;
            });
            document.getElementById('reviewModal').style.display = 'flex';
        }

        function addReview(e) {
            e.preventDefault();
            const prodId = document.getElementById('reviewProdId').value;
            const stars = document.getElementById('reviewStars').value;
            const comment = document.getElementById('reviewComment').value;

            let reviews = getReviews();
            if(!reviews[prodId]) reviews[prodId] = [];
            reviews[prodId].push({ stars, comment });

            localStorage.setItem('store_reviews', JSON.stringify(reviews));
            alert('شكراً لتقييمك!');
            closeModal('reviewModal');
        }

        function openProfileModal() {
            const container = document.getElementById('profileModalContent');
            
            if(!currentUser) {
                container.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <button class="close-btn" onclick="closeModal('profileModal')">✕</button>
                    </div>
                    <div class="auth-box">
                        <div class="auth-avatar"><i class="fa-regular fa-user"></i></div>
                        <h3 style="margin-bottom:15px;">تسجيل الدخول</h3>
                        <form onsubmit="login(event)">
                            <div class="form-group">
                                <label>البريد الإلكتروني</label>
                                <input type="email" id="logEmail" placeholder="your@email.com" required>
                            </div>
                            <div class="form-group">
                                <label>كلمة المرور</label>
                                <input type="password" id="logPass" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="add-cart-btn" style="background:var(--primary-gold); color:black; font-weight:bold; padding:12px; margin-top:10px;">دخول</button>
                        </form>

                        <div style="margin-top:20px; font-size:0.8rem; color:var(--text-muted);">أو سجل دخولك من خلال</div>
                        <div class="social-btn-group">
                            <div class="social-btn"><i class="fa-brands fa-apple"></i></div>
                            <div class="social-btn"><i class="fa-brands fa-facebook-f"></i></div>
                            <div class="social-btn"><i class="fa-brands fa-google"></i></div>
                        </div>
                    </div>
                `;
            } else {
                let html = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <button class="close-btn" onclick="closeModal('profileModal')">✕</button>
                    </div>
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px; padding-bottom:15px; border-bottom:1px solid var(--border-color);">
                        <div class="auth-avatar" style="margin:0; width:50px; height:50px; font-size:1.3rem;"><i class="fa-solid fa-user"></i></div>
                        <div>
                            <div style="font-size:0.8rem; color:var(--text-muted);">مرحباً بك</div>
                            <h3 style="font-size:1.1rem;">${currentUser.name}</h3>
                        </div>
                    </div>

                    <div class="user-menu-item"><i class="fa-regular fa-bell"></i> الإشعارات</div>
                    <div class="user-menu-item"><i class="fa-solid fa-box-open"></i> الطلبات السابقة</div>
                    <div class="user-menu-item"><i class="fa-regular fa-heart"></i> الأمنيات</div>
                    <div class="user-menu-item"><i class="fa-solid fa-gear"></i> الإعدادات</div>
                    <div class="user-menu-item" onclick="logout()" style="color:var(--accent-red);"><i class="fa-solid fa-right-from-bracket" style="color:var(--accent-red);"></i> تسجيل الخروج</div>
                `;

                if(currentUser.role === 'admin') {
                    const bannerConfig = getBannerConfig();
                    html += `
                        <div class="admin-section" style="margin-top:20px;">
                            <h3 style="color:var(--primary-gold); margin-bottom:10px;">⚙️ لوحة تحكم المدير (المالك)</h3>
                            <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:12px;">إيميل إشعارات المتجر: <b>${STORE_EMAIL}</b></p>
                            
                            <button class="add-cart-btn" style="background:var(--primary-gold); color:black; margin-bottom:8px;" onclick="sendTestEmail()"><i class="fa-solid fa-envelope"></i> إرسال رسالة شكر واختبار تجريبي</button>
                            <button class="add-cart-btn" style="background:var(--success); color:white; margin-bottom:12px;" onclick="exportToCSV()"><i class="fa-solid fa-file-excel"></i> تصدير الطلبات إلى Excel (CSV)</button>

                            <h4 style="margin-top:15px; font-size:0.9rem;">⏳ إعدادات شريط العروض والمؤقت</h4>
                            <div class="form-group" style="margin-top:8px;">
                                <label>حالة الشريط</label>
                                <select id="adminBannerShow">
                                    <option value="true" ${bannerConfig.show ? 'selected' : ''}>ظاهر للمستخدمين</option>
                                    <option value="false" ${!bannerConfig.show ? 'selected' : ''}>مخفي</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>نص العرض</label>
                                <input type="text" id="adminBannerText" value="${bannerConfig.text}">
                            </div>
                            <div class="form-group">
                                <label>مدة المؤقت بالساعات</label>
                                <input type="number" id="adminBannerHours" value="${bannerConfig.hours}">
                            </div>
                            <button onclick="saveBannerConfig()" style="padding:8px 12px; background:var(--primary-gold); color:black; font-weight:bold; border:none; border-radius:6px; cursor:pointer; width:100%;">حفظ إعدادات الشريط</button>

                            <h4 style="margin-top:15px; font-size:0.9rem;">🚚 حد الشحن المجاني</h4>
                            <div class="form-group" style="margin-top:8px;">
                                <label>الحد الأدنى للشحن المجاني (درهم)</label>
                                <div style="display:flex; gap:6px;">
                                    <input type="number" id="minShippingInput" value="${getFreeShippingMin()}">
                                    <button onclick="saveMinShipping()" style="padding:8px 12px; background:var(--primary-gold); color:black; font-weight:bold; border:none; border-radius:6px; cursor:pointer;">حفظ</button>
                                </div>
                            </div>

                            <h4 style="margin-top:15px; font-size:0.9rem;">🎟️ إدارة كوبونات الخصم</h4>
                            <form onsubmit="addCoupon(event)" style="margin:10px 0; display:flex; gap:6px;">
                                <input type="text" id="cCode" placeholder="الكود" required style="flex:2;">
                                <input type="number" id="cPercent" placeholder="%" required style="flex:1;">
                                <button type="submit" style="padding:8px; background:var(--primary-gold); color:black; font-weight:bold; border:none; border-radius:6px; cursor:pointer;">إضافة</button>
                            </form>
                            <div id="couponsList"></div>

                            <h4 style="margin-top:15px; font-size:0.9rem;">📋 إدارة الطلبات والطباعة</h4>
                            <div id="allAdminOrders" style="margin:10px 0;"></div>

                            <h4 style="margin-top:15px; font-size:0.9rem;">إضافة منتج جديد</h4>
                            <form onsubmit="saveProduct(event)">
                                <div class="form-group"><label>اسم المنتج</label><input type="text" id="pName" required></div>
                                <div class="form-group"><label>القسم</label>
                                    <select id="pCat">
                                        <option value="best">الأكثر مبيعاً</option>
                                        <option value="cups">الفناجيل والدلات</option>
                                        <option value="plates">القدور والصحون</option>
                                    </select>
                                </div>
                                <div class="form-group"><label>السعر (درهم)</label><input type="number" id="pPrice" required></div>
                                <div class="form-group"><label>الكمية بالمخزون</label><input type="number" id="pStock" value="10" required></div>
                                <div class="form-group"><label>رابط الصورة</label><input type="url" id="pImg" required></div>
                                <button type="submit" class="add-cart-btn" style="background:var(--success); color:white;">حفظ المنتج</button>
                            </form>
                        </div>
                    `;
                }

                container.innerHTML = html;
                if(currentUser.role === 'admin') {
                    renderAdminOrders();
                    renderCoupons();
                }
            }

            document.getElementById('profileModal').style.display = 'flex';
        }

        function saveBannerConfig() {
            const show = document.getElementById('adminBannerShow').value === 'true';
            const text = document.getElementById('adminBannerText').value;
            const hours = Number(document.getElementById('adminBannerHours').value);
            localStorage.setItem('store_banner_config', JSON.stringify({ show, text, hours }));
            initBanner();
            alert('تم حفظ إعدادات الشريط بنجاح!');
        }

        function saveMinShipping() {
            const val = document.getElementById('minShippingInput').value;
            localStorage.setItem('free_shipping_min', val);
            alert('تم حفظ حد الشحن المجاني!');
        }

        function renderCoupons() {
            const coupons = getCoupons();
            const container = document.getElementById('couponsList');
            container.innerHTML = coupons.length ? '' : '<small>لا توجد كوبونات</small>';
            coupons.forEach((c, index) => {
                container.innerHTML += `
                    <div class="coupon-item">
                        <div><b>${c.code}</b> (${c.percent}%) <span style="color:${c.active ? '#10b981' : '#ef4444'}">[${c.active ? 'مفعل' : 'معطل'}]</span></div>
                        <div style="display:flex; gap:5px;">
                            <button onclick="toggleCoupon(${index})" style="padding:4px 8px; border:none; border-radius:4px; background:#444; color:white; cursor:pointer;">${c.active ? 'تعطيل' : 'تفعيل'}</button>
                            <button onclick="deleteCoupon(${index})" style="padding:4px 8px; border:none; border-radius:4px; background:var(--accent-red); color:white; cursor:pointer;">حذف</button>
                        </div>
                    </div>`;
            });
        }

        function addCoupon(e) {
            e.preventDefault();
            const coupons = getCoupons();
            const code = document.getElementById('cCode').value.toUpperCase().trim();
            const percent = Number(document.getElementById('cPercent').value);
            if(coupons.find(c => c.code === code)) return alert('الكوبون موجود مسبقاً!');
            coupons.push({ code, percent, active: true });
            localStorage.setItem('store_coupons', JSON.stringify(coupons));
            renderCoupons();
            alert('تمت إضافة الكوبون!');
        }

        function toggleCoupon(index) {
            let coupons = getCoupons();
            coupons[index].active = !coupons[index].active;
            localStorage.setItem('store_coupons', JSON.stringify(coupons));
            renderCoupons();
        }

        function deleteCoupon(index) {
            let coupons = getCoupons();
            coupons.splice(index, 1);
            localStorage.setItem('store_coupons', JSON.stringify(coupons));
            renderCoupons();
        }

        function renderAdminOrders() {
            const orders = getOrders();
            const container = document.getElementById('allAdminOrders');
            container.innerHTML = orders.length ? '' : '<small>لا توجد طلبات</small>';
            orders.forEach((o, index) => {
                container.innerHTML += `
                    <div style="background:#27272a; padding:10px; border-radius:6px; margin-bottom:8px; font-size:0.8rem;">
                        <div><b>الطلب:</b> ${o.orderNum} | <b>العميل:</b> ${o.userName}</div>
                        <div><b>المنتجات:</b> ${o.items}</div>
                        <div><b>الإجمالي:</b> ${o.total}</div>
                        <div style="margin-top:6px; display:flex; justify-content:space-between; align-items:center;">
                            <select onchange="updateOrderStatus(${index}, this.value)" style="padding:4px; border-radius:4px;">
                                <option value="قيد التجهيز ⏳" ${o.status === 'قيد التجهيز ⏳' ? 'selected' : ''}>قيد التجهيز ⏳</option>
                                <option value="جاري التوصيل 🚚" ${o.status === 'جاري التوصيل 🚚' ? 'selected' : ''}>جاري التوصيل 🚚</option>
                                <option value="تم التسليم ✅" ${o.status === 'تم التسليم ✅' ? 'selected' : ''}>تم التسليم ✅</option>
                            </select>
                            <button onclick="printInvoice(${index})" style="padding:4px 8px; background:var(--primary-gold); color:black; font-weight:bold; border:none; border-radius:4px; cursor:pointer;"><i class="fa-solid fa-print"></i> طباعة</button>
                        </div>
                    </div>`;
            });
        }

        function updateOrderStatus(index, newStatus) {
            let orders = getOrders();
            orders[index].status = newStatus;
            localStorage.setItem('store_orders', JSON.stringify(orders));
            alert('تم تحديث حالة الطلب!');
        }

        function printInvoice(index) {
            const o = getOrders()[index];
            const invoiceDiv = document.getElementById('printableInvoice');
            invoiceDiv.innerHTML = `
                <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:20px;">
                    <h2>متجر الأواني والضيافة</h2>
                    <p>فاتورة مبيعات</p>
                </div>
                <p><b>رقم الطلب:</b> ${o.orderNum}</p>
                <p><b>اسم العميل:</b> ${o.userName}</p>
                <p><b>الجوال:</b> ${o.userPhone}</p>
                <p><b>التاريخ:</b> ${o.date}</p>
                <hr style="margin:10px 0;">
                <p><b>المنتجات:</b> ${o.items}</p>
                <p><b>طريقة الدفع:</b> ${o.payment}</p>
                <h3><b>المجموع الكلي:</b> ${o.total}</h3>
            `;
            window.print();
        }

        function exportToCSV() {
            const orders = getOrders();
            if(!orders.length) return alert('لا توجد طلبات!');
            let csvContent = "\uFEFFرقم الطلب,العميل,الجوال,المنتجات,المجموع,الدفع,الحالة,التاريخ\n";
            orders.forEach(o => {
                csvContent += `"${o.orderNum}","${o.userName}","${o.userPhone}","${o.items}","${o.total}","${o.payment}","${o.status}","${o.date}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'store_orders.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function sendTestEmail() {
            alert(`تم إرسال رسالة الشكر والاختبار التجريبي إلى البريد: ${STORE_EMAIL}\n(تم تنفيذ المحاكاة بنجاح)`);
        }

        function login(e) {
            e.preventDefault();
            const email = document.getElementById('logEmail').value;
            const pass = document.getElementById('logPass').value;

            if(email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                currentUser = { name: "سيف عبدالله", email: ADMIN_EMAIL, role: "admin" };
            } else {
                const users = getUsers();
                const user = users.find(u => u.email === email && u.pass === pass);
                if(!user) return alert('بيانات الدخول غير صحيحة!');
                currentUser = user;
            }

            localStorage.setItem('current_user', JSON.stringify(currentUser));
            openProfileModal();
            renderStore();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('current_user');
            openProfileModal();
            renderStore();
        }

        function addToCart(id) {
            const products = getProducts();
            const p = products.find(item => item.id === id);
            if(p.stock <= 0) return alert('عذراً، نفدت الكمية!');
            cart.push(p);
            document.getElementById('cartCount').innerText = cart.length;
            alert('تمت إضافة ' + p.name + ' للسلة');
        }

        function openCart() {
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item) => {
                total += Number(item.price);
                container.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px; background:#1c1c21; padding:8px; border-radius:6px;"><span>${item.name}</span><b style="color:var(--primary-gold);">${item.price} درهم</b></div>`;
            });
            
            if(discountRate > 0) total = total * (1 - discountRate);

            const minShipping = getFreeShippingMin();
            const progress = Math.min((total / minShipping) * 100, 100);
            document.getElementById('shippingProgress').style.width = progress + '%';
            
            if(total >= minShipping && total > 0) {
                document.getElementById('shippingText').innerHTML = '🎉 مبروك! حصلت على <b style="color:var(--success);">شحن مجاني</b>';
            } else {
                const diff = minShipping - total;
                document.getElementById('shippingText').innerText = `أضف بـ ${diff} درهم إضافية للحصول على شحن مجاني!`;
            }

            document.getElementById('cartTotal').innerText = total + ' درهم';
            document.getElementById('cartModal').style.display = 'flex';
        }

        function applyCoupon() {
            const inputCode = document.getElementById('couponInput').value.toUpperCase().trim();
            const coupons = getCoupons();
            const found = coupons.find(c => c.code === inputCode);
            if (!found || !found.active) return alert('رمز الخصم غير صحيح أو متوقف!');
            discountRate = found.percent / 100;
            alert(`تم تطبيق خصم ${found.percent}% بنجاح!`);
            openCart();
        }

        function playAlertSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function checkout() {
            if(!currentUser) {
                closeModal('cartModal');
                alert('يرجى تسجيل الدخول أولاً لإتمام الطلب!');
                openProfileModal();
                return;
            }
            if(!cart.length) return alert('السلة فارغة!');

            let products = getProducts();
            cart.forEach(item => {
                let prod = products.find(p => p.id === item.id);
                if(prod && prod.stock > 0) prod.stock -= 1;
            });
            localStorage.setItem('store_products', JSON.stringify(products));

            const payment = document.getElementById('paymentMethod').value;
            const orders = getOrders();
            const newOrder = {
                id: Date.now(),
                orderNum: generateOrderNumber(),
                userName: currentUser.name,
                userEmail: currentUser.email,
                userPhone: currentUser.phone || 'غير مدخل',
                items: cart.map(c => c.name).join(', '),
                total: document.getElementById('cartTotal').innerText,
                payment: payment,
                status: 'قيد التجهيز ⏳',
                date: new Date().toLocaleDateString('ar-AE')
            };

            orders.push(newOrder);
            localStorage.setItem('store_orders', JSON.stringify(orders));

            playAlertSound();
            alert('تم استلام طلبك برقم ' + newOrder.orderNum + ' بنجاح! وتم إرسال رسالة الشكر للإيميل: ' + STORE_EMAIL);
            cart = [];
            discountRate = 0;
            document.getElementById('cartCount').innerText = '0';
            closeModal('cartModal');
            renderStore();
        }

        function checkoutWhatsapp() {
            if(!cart.length) return alert('السلة فارغة!');
            const itemsList = cart.map(c => c.name).join(', ');
            const total = document.getElementById('cartTotal').innerText;
            const payment = document.getElementById('paymentMethod').value;
            const message = `مرحباً، أرغب في إتمام الطلب التالي:%0A- المنتجات: ${itemsList}%0A- المجموع: ${total}%0A- طريقة الدفع: ${payment}`;
            window.open(`https://wa.me/?text=${message}`, '_blank');
        }

        function saveProduct(e) {
            e.preventDefault();
            const products = getProducts();
            products.push({
                id: Date.now(),
                name: document.getElementById('pName').value,
                category: document.getElementById('pCat').value,
                price: Number(document.getElementById('pPrice').value),
                stock: Number(document.getElementById('pStock').value),
                img: document.getElementById('pImg').value
            });
            localStorage.setItem('store_products', JSON.stringify(products));
            renderStore();
            alert('تم حفظ المنتج بنجاح');
            openProfileModal();
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        window.onload = function () {
            initBanner();
            renderStore();
        };
    </script>
</body>
</html>
