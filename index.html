<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري السحابي</title>
    <!-- Tailwind CSS لتصميم سريع وجميل -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm">
            <h1 class="text-2xl font-bold text-gray-800">🛍️ لوحة المتجر السحابي</h1>
            <span id="sync-status" class="text-xs px-3 py-1 rounded-full bg-yellow-100 text-yellow-800">جاري الاتصال بالسحابة...</span>
        </header>

        <!-- إضافة منتج جديد -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-8">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">إضافة منتج جديد</h2>
            <form id="product-form" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <input type="text" id="product-name" placeholder="اسم المنتج" required class="border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="product-price" placeholder="السعر" required class="border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="bg-blue-600 text-white rounded-lg py-2 hover:bg-blue-700 transition">إضافة وحفظ سحابياً</button>
            </form>
        </div>

        <!-- قائمة المنتجات -->
        <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">قائمة المنتجات المتزامنة</h2>
            <div id="products-list" class="divide-y divide-gray-100">
                <p class="text-gray-400 text-center py-4">جاري تحميل المنتجات...</p>
            </div>
        </div>
    </div>

    <!-- كود ربط Firebase والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyAAMzTCbpmqPWc44OpXCzOq5d3PIaigAZk",
            authDomain: "my-store-9bc1c.firebaseapp.com",
            projectId: "my-store-9bc1c",
            storageBucket: "my-store-9bc1c.firebasestorage.app",
            messagingSenderId: "180366868806",
            appId: "1:180366868806:web:c9e481fe81979cda1c2547",
            measurementId: "G-6SM9LL340G"
        };

        // تهيئة فايربيس وقاعدة البيانات
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statusBadge = document.getElementById('sync-status');
        statusBadge.textContent = "متصل بالسحابة (دبي)";
        statusBadge.className = "text-xs px-3 py-1 rounded-full bg-green-100 text-green-800";

        const form = document.getElementById('product-form');
        const productsList = document.getElementById('products-list');

        // حفظ منتج جديد في Firestore
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('product-name').value;
            const price = document.getElementById('product-price').value;

            try {
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    createdAt: new Date()
                });
                form.reset();
            } catch (error) {
                console.error("خطأ أثناء الإضافة: ", error);
                alert("حدث خطأ أثناء حفظ المنتج.");
            }
        });

        // الاستماع للتحديثات الفورية (Real-time Sync)
        onSnapshot(collection(db, "products"), (snapshot) => {
            productsList.innerHTML = "";
            if (snapshot.empty) {
                productsList.innerHTML = '<p class="text-gray-400 text-center py-4">لا توجد منتجات حالياً. أضف منتجك الأول!</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const product = doc.data();
                const itemDiv = document.createElement('div');
                itemDiv.className = "py-3 flex justify-between items-center";
                itemDiv.innerHTML = `
                    <span class="font-medium text-gray-800">\${product.name}</span>
                    <span class="text-blue-600 font-semibold">\${product.price} ر.س</span>
                `;
                productsList.appendChild(itemDiv);
            });
        });
    </script>
</body>
</html>
