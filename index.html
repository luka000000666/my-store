<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الأواني والضيافة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #fdfbf7;
            --card-bg: #ffffff;
            --primary-beige: #f5efe6;
            --accent-gold: #c59b27;
            --text-dark: #2c2a29;
            --text-muted: #78716c;
            --border-color: #e7e5e4;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-dark); padding-bottom: 60px; }

        /* HEADER */
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.2rem; color: var(--text-dark); font-weight: 800; }
        .header-actions { display: flex; gap: 8px; }
        .btn-header { background: var(--primary-beige); color: var(--text-dark); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .cart-badge { background: var(--accent-gold); color: white; font-size: 0.7rem; border-radius: 50%; padding: 2px 6px; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        /* SECTION HEADERS */
        .section-title { font-size: 1.1rem; font-weight: 800; margin: 25px 0 15px 0; color: var(--text-dark); border-right: 4px solid var(--accent-gold); padding-right: 10px; }

        /* GRID 2x2 FOR MOBILE */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media(min-width: 768px) { .products-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        /* PRODUCT CARD */
        .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; }
        .product-img { width: 100%; height: 150px; object-fit: cover; background: #fafaf9; }
        .product-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
        .product-price { font-size: 0.95rem; font-weight: 800; color: var(--accent-gold); margin-bottom: 8px; }
        .add-cart-btn { width: 100%; background: var(--primary-beige); color: var(--text-dark); border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }

        /* CART & PAYMENT MODALS */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:300; justify-content:center; align-items:center; padding:15px; }
        .modal-content { background:white; border-radius:16px; padding:20px; width:100%; max-width:450px; max-height:90vh; overflow-y:auto; }
        .close-btn { background:none; border:none; font-size:1.2rem; cursor:pointer; }

        /* FORM INPUTS */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; }

        /* DARK ADMIN PANEL (RESTRICTED ACCESS) */
        #adminPage { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; color: #f5f5f5; z-index: 400; overflow-y: auto; padding: 20px 15px; }
        .admin-card { background: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #2d2d2d; }
        .admin-card input, .admin-card select { background: #2a2a2a; color: white; border: 1px solid #3d3d3d; }
        
        .order-item { background: #2a2a2a; border-radius: 8px; padding: 12px; margin-bottom: 10px; border-right: 4px solid var(--accent-gold); }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية للمتجر -->
    <header>
        <h1>متجر الأواني والضيافة</h1>
        <div class="header-actions">
            <button class="btn-header" onclick="openCart()"><i class="fa-solid fa-bag-shopping"></i> السلة <span class="cart-badge" id="cartCount">0</span></button>
            <button class="btn-header" onclick="openAdminAuth()"><i class="fa-solid fa-lock"></i> التحكم</button>
        </div>
    </header>

    <div class="container">
        <div class="section-title">الأكثر مبيعاً</div>
        <div class="products-grid" id="bestGrid"></div>

        <div class="section-title">الفناجيل، الدلات والكاسات</div>
        <div class="products-grid" id="cupsGrid"></div>

        <div class="section-title">القدور والصحون</div>
        <div class="products-grid" id="platesGrid"></div>
    </div>

    <!-- نافذة السلة -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3>سلة الشراء</h3>
                <button class="close-btn" onclick="closeModal('cartModal')">✕</button>
            </div>
            <div id="cartItems"></div>
            <div style="margin-top:15px; font-weight:bold; display:flex; justify-content:space-between;">
                <span>المجموع:</span><span id="cartTotal">0 درهم</span>
            </div>
            <button class="add-cart-btn" style="background:var(--accent-gold); color:white; margin-top:15px;" onclick="openPayment()">المتابعة للطلب</button>
        </div>
    </div>

    <!-- نافذة إتمام الطلب (بيانات العميل) -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3>تفاصيل الطلب والدفع</h3>
                <button class="close-btn" onclick="closeModal('paymentModal')">✕</button>
            </div>
            <form onsubmit="submitOrder(event)">
                <div class="form-group"><label>الاسم الكامل</label><input type="text" id="custName" required></div>
                <div class="form-group"><label>رقم الجوال</label><input type="tel" id="custPhone" required></div>
                <div class="form-group"><label>العنوان / المدينة</label><input type="text" id="custAddress" required></div>
                <button type="submit" class="add-cart-btn" style="background:var(--success); color:white; margin-top:10px;">تأكيد وإرسال الطلب</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الخاصة بك فقط (الوضع الداكن) -->
    <div id="adminPage">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>لوحة التحكم الخاصة</h2>
            <button class="close-btn" style="color:white;" onclick="closeAdmin()">✕ خروج</button>
        </div>

        <!-- قائمة الطلبات الواردة -->
        <h3 style="color:var(--accent-gold); margin-bottom:10px;">📋 قائمة الطلبات الواردة</h3>
        <div class="admin-card" id="ordersList"></div>

        <!-- إضافة / تعديل منتج -->
        <h3 style="color:var(--accent-gold); margin-bottom:10px;">📦 إدارة المنتجات</h3>
        <div class="admin-card">
            <form onsubmit="saveProduct(event)">
                <input type="hidden" id="editId">
                <div class="form-group"><label>اسم المنتج</label><input type="text" id="pName" required></div>
                <div class="form-group"><label>القسم</label>
                    <select id="pCat">
                        <option value="best">الأكثر مبيعاً</option>
                        <option value="cups">الفناجيل والدلات</option>
                        <option value="plates">القدور والصحون</option>
                    </select>
                </div>
                <div class="form-group"><label>السعر (درهم)</label><input type="number" id="pPrice" required></div>
                <div class="form-group"><label>رابط الصورة</label><input type="url" id="pImg" required></div>
                <button type="submit" class="add-cart-btn" style="background:var(--success); color:white; margin-top:10px;">حفظ المنتج</button>
            </form>
        </div>

        <!-- تعديل وحذف المنتجات -->
        <div class="admin-card" id="adminProductsList"></div>
    </div>

    <script>
        const PIN_CODE = "1234"; // الرقم السري للدخول للوحة التحكم
        let cart = [];

        const initialProducts = [
            { id: 1, name: "طقم دلال ذهبي فاخر", category: "best", price: 320, img: "https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?w=500" },
            { id: 2, name: "فناجيل قهوة شفافة", category: "cups", price: 85, img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=500" }
        ];

        function getProducts() { return JSON.parse(localStorage.getItem('store_products')) || initialProducts; }
        function getOrders() { return JSON.parse(localStorage.getItem('store_orders')) || []; }

        function renderStore() {
            const products = getProducts();
            ['best', 'cups', 'plates'].forEach(cat => {
                const grid = document.getElementById(cat + 'Grid');
                grid.innerHTML = '';
                products.filter(p => p.category === cat).forEach(p => {
                    grid.innerHTML += `
                        <div class="product-card">
                            <img src="${p.img}" class="product-img">
                            <div class="product-info">
                                <div class="product-title">${p.name}</div>
                                <div class="product-price">${p.price} درهم</div>
                                <button class="add-cart-btn" onclick="addToCart(${p.id})">إضافة للسلة</button>
                            </div>
                        </div>`;
                });
            });
        }

        /* السلة والطلبات */
        function addToCart(id) {
            const p = getProducts().find(item => item.id === id);
            cart.push(p);
            document.getElementById('cartCount').innerText = cart.length;
            alert('تمت إضافة ' + p.name + ' للسلة');
        }
        function openCart() {
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, i) => {
                total += Number(item.price);
                container.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>${item.name}</span><b>${item.price} درهم</b></div>`;
            });
            document.getElementById('cartTotal').innerText = total + ' درهم';
            document.getElementById('cartModal').style.display = 'flex';
        }
        function openPayment() { closeModal('cartModal'); document.getElementById('paymentModal').style.display = 'flex'; }
        function submitOrder(e) {
            e.preventDefault();
            const orders = getOrders();
            orders.push({
                id: Date.now(),
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                address: document.getElementById('custAddress').value,
                items: cart.map(c => c.name).join(', '),
                total: document.getElementById('cartTotal').innerText,
                date: new Date().toLocaleDateString('ar-AE')
            });
            localStorage.setItem('store_orders', JSON.stringify(orders));
            alert('تم إرسال طلبك بنجاح!');
            cart = [];
            document.getElementById('cartCount').innerText = '0';
            closeModal('paymentModal');
        }

        /* حماية لوحة التحكم بالرمز السري */
        function openAdminAuth() {
            const pass = prompt("أدخل الرمز السري للوحة التحكم:");
            if(pass === PIN_CODE) {
                document.getElementById('adminPage').style.display = 'block';
                renderAdminOrders();
                renderAdminProducts();
            } else {
                alert("رمز المرور غير صحيح!");
            }
        }
        function closeAdmin() { document.getElementById('adminPage').style.display = 'none'; }

        function renderAdminOrders() {
            const orders = getOrders();
            const list = document.getElementById('ordersList');
            list.innerHTML = orders.length ? '' : '<p>لا توجد طلبات جديدة</p>';
            orders.forEach(o => {
                list.innerHTML += `
                    <div class="order-item">
                        <div><b>العميل:</b> ${o.name} (${o.phone})</div>
                        <div><b>العنوان:</b> ${o.address}</div>
                        <div><b>الطلبات:</b> ${o.items}</div>
                        <div><b>الإجمالي:</b> ${o.total} - <small>${o.date}</small></div>
                    </div>`;
            });
        }

        function renderAdminProducts() {
            const products = getProducts();
            const list = document.getElementById('adminProductsList');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; background:#2a2a2a; padding:8px; border-radius:6px;">
                        <span>${p.name} - ${p.price} درهم</span>
                        <button onclick="deleteProduct(${p.id})" style="background:red; color:white; border:none; padding:4px 8px; border-radius:4px;">حذف</button>
                    </div>`;
            });
        }

        function saveProduct(e) {
            e.preventDefault();
            const products = getProducts();
            products.push({
                id: Date.now(),
                name: document.getElementById('pName').value,
                category: document.getElementById('pCat').value,
                price: Number(document.getElementById('pPrice').value),
                img: document.getElementById('pImg').value
            });
            localStorage.setItem('store_products', JSON.stringify(products));
            renderStore();
            renderAdminProducts();
            alert('تم حفظ المنتج');
        }

        function deleteProduct(id) {
            let products = getProducts().filter(p => p.id !== id);
            localStorage.setItem('store_products', JSON.stringify(products));
            renderStore();
            renderAdminProducts();
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        renderStore();
    </script>
</body>
</html>
